# Test gate for the dev and production web deploys.
# Keep these steps aligned with the unit and e2e jobs in pr-checks.yml.
# The caller deploys only when both jobs succeed. A failure here fails the
# Actions run, and the deploy job is skipped.
name: Test gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (npm test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install Pillow so the icon generator test runs
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 -c 'import PIL'
      - run: npm ci
      - name: Unit tests
        run: npm test
        env:
          KITPHONIC_REQUIRE_PILLOW: '1'

  e2e:
    name: End-to-end tests (npm run test:e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Touch e2e
        run: npm run test:e2e
      - name: Upload Playwright report, screenshots, and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
