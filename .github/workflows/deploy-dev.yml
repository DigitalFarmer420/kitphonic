# Deploys the tested commit on `develop` to the separate DEV Pages site:
#   https://digitalfarmer420.github.io/kitphonic-dev/
# Production (branch main, https://digitalfarmer420.github.io/kitphonic/) is never touched.
# Auth: secret DEV_DEPLOY_KEY = SSH deploy key with write access to kitphonic-dev ONLY.
name: Deploy dev preview
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  gate:
    name: Test gate
    uses: ./.github/workflows/test-gate.yml
    permissions:
      contents: read

  deploy:
    name: Deploy dev preview
    needs: gate
    if: github.ref == 'refs/heads/develop' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          path: src
      - name: Clone kitphonic-dev with deploy key
        env:
          DEV_DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEV_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:DigitalFarmer420/kitphonic-dev.git site || (mkdir site && cd site && git init -b main && git remote add origin git@github.com:DigitalFarmer420/kitphonic-dev.git)
      - name: Build site (copy tree + DEV badge)
        run: |
          cd site
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cd ..
          rsync -a --exclude .git --exclude .github src/ site/
          touch site/.nojekyll
          python3 src/.github/dev/inject-dev-badge.py site/index.html
          # Stamp the dev site with the develop commit it was built from (KP-QA-006).
          git -C src rev-parse HEAD > site/VERSION.txt
          test "$(cat site/VERSION.txt)" = "$GITHUB_SHA"
      - name: Commit and push (normal push, no force)
        run: |
          cd site
          git config user.name "DigitalFarmer420"
          git config user.email "vinteedle@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            echo "Dev site already matches \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "Deploy kitphonic develop@${GITHUB_SHA::7}"
          git push origin HEAD:main
          echo "Deployed $(git rev-parse HEAD) from develop@${GITHUB_SHA}"
          echo "Published \`$GITHUB_SHA\` to https://digitalfarmer420.github.io/kitphonic-dev/" >> "$GITHUB_STEP_SUMMARY"
