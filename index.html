<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kitphonic</title>
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="wave" viewBox="0 0 40 40"><path d="M8 20h3M14 13v14M20 8v24M26 13v14M32 20h0" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/></symbol>
<symbol id="snd-one" viewBox="0 0 40 40"><path d="M9 16h5l7-6v20l-7-6H9z" fill="#fff"/><path d="M26 14a8 8 0 0 1 0 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/></symbol>
<symbol id="snd-chunk" viewBox="0 0 64 40"><path d="M5 16h5l7-6v20l-7-6H5z" fill="#fff"/><path d="M21 15a7 7 0 0 1 0 10" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/><rect x="29" y="13" width="31" height="14" rx="7" fill="none" stroke="#fff" stroke-width="3.5"/></symbol>
<symbol id="kit" viewBox="0 0 120 120">
 <path d="M24 40 L30 8 L52 30Z" fill="#F2B950"/><path d="M96 40 L90 8 L68 30Z" fill="#F2B950"/>
 <path d="M30 34 L33 18 L44 30Z" fill="#F7CFA0"/><path d="M90 34 L87 18 L76 30Z" fill="#F7CFA0"/>
 <ellipse cx="60" cy="66" rx="44" ry="40" fill="#F2B950"/><ellipse cx="60" cy="80" rx="26" ry="20" fill="#FFF3DF"/>
 <ellipse cx="44" cy="62" rx="6" ry="8" fill="#3A2E28"/><ellipse cx="76" cy="62" rx="6" ry="8" fill="#3A2E28"/>
 <circle cx="46" cy="59" r="2" fill="#fff"/><circle cx="78" cy="59" r="2" fill="#fff"/>
 <path d="M56 74 h8 l-4 5z" fill="#EF8B6E"/><path d="M52 82 q8 7 16 0" stroke="#3A2E28" stroke-width="3" fill="none" stroke-linecap="round"/>
 <circle cx="34" cy="76" r="6" fill="#EF8B6E" opacity=".4"/><circle cx="86" cy="76" r="6" fill="#EF8B6E" opacity=".4"/>
 <path d="M30 34 q-6 -10 2 -4" fill="none"/>
</symbol>
<symbol id="mat" viewBox="0 0 120 80"><ellipse cx="60" cy="66" rx="50" ry="6" fill="#E9DCC8"/><path d="M26 22 H94 L108 62 H12 Z" fill="#EF8B6E" stroke="#C9604A" stroke-width="2" stroke-linejoin="round"/><path d="M31 27 H89 L100 57 H20 Z" fill="none" stroke="#FFE3D6" stroke-width="3" stroke-linejoin="round"/><path d="M60 31 L72 42 L60 53 L48 42 Z" fill="#F2B950"/><path d="M36 42 h6 M78 42 h6" stroke="#F2B950" stroke-width="4" stroke-linecap="round"/><path d="M28 22 l-3 -7 M36 22 l-2 -7 M44 22 l-1 -7 M52 22 v-7 M60 22 v-7 M68 22 v-7 M76 22 l1 -7 M84 22 l2 -7 M92 22 l3 -7 M16 62 l-3 9 M26 62 l-2 9 M36 62 l-1 9 M46 62 v9 M56 62 v9 M66 62 v9 M76 62 v9 M86 62 l1 9 M96 62 l2 9 M106 62 l3 9" stroke="#C9604A" stroke-width="2.5" stroke-linecap="round"/></symbol>
<symbol id="cat" viewBox="0 0 120 80"><path d="M36 24l6-18 12 14M84 24l-6-18-12 14" fill="#9C9089"/><ellipse cx="60" cy="40" rx="30" ry="26" fill="#9C9089"/><circle cx="50" cy="38" r="4" fill="#3A2E28"/><circle cx="70" cy="38" r="4" fill="#3A2E28"/><path d="M57 46h6l-3 3z" fill="#EF8B6E"/><path d="M30 48h18M30 54h18M72 48h18M72 54h18" stroke="#5B4A40" stroke-width="2"/></symbol>
<symbol id="hat" viewBox="0 0 120 80"><ellipse cx="60" cy="62" rx="48" ry="10" fill="#4E97C9"/><path d="M34 62 V24 q26 -14 52 0 V62z" fill="#86BFE3"/><rect x="34" y="46" width="52" height="9" fill="#F2B950"/></symbol>
<symbol id="hand" viewBox="0 0 60 70"><path d="M22 8a6 6 0 0 1 12 0v24l4-2a6 6 0 0 1 8 3l2 3 4-1a5 5 0 0 1 6 5v8c0 12-9 20-20 20h-6c-8 0-13-4-17-10L4 44a5 5 0 0 1 8-6l10 8z" fill="#fff" stroke="#3A2E28" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="paw" viewBox="0 0 60 60"><path d="M18 56 L24 26" stroke="#F2B950" stroke-width="14" stroke-linecap="round"/><ellipse cx="26" cy="20" rx="13" ry="12" fill="#F2B950"/><ellipse cx="26" cy="22" rx="7" ry="6" fill="#FFF3DF"/></symbol>
</defs></svg>

<div id="stage">
  <!-- Hello / audio unlock -->
  <section id="hello" class="screen" aria-label="Hello">
    <div class="kitwrap"><svg width="220" height="220"><use href="#kit"/></svg><svg class="paw"><use href="#paw"/></svg></div>
    <div class="bubble" id="hello-bubble">Hi! I’m Kit.</div>
    <button id="play" aria-label="Start"><svg width="44" height="44" viewBox="0 0 44 44"><path d="M14 8 L36 22 L14 36Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></button>
    <button id="speaker" aria-label="Sound help">🔈</button>
    <div id="tip" hidden></div>
  </section>

  <!-- Word screen: decode & reveal (spec §3.5) -->
  <section id="word" class="screen" hidden aria-label="Word">
    <div class="top">
      <button class="btn" id="home" aria-label="Home">⌂</button>
      <div class="path" id="pebbles"></div>
      <button class="btn coral" id="again" aria-label="Say it again">↻</button>
    </div>
    <div class="mascot" id="word-mascot"><svg width="80" height="80"><use href="#kit"/></svg><div class="bubble" id="bubble"></div></div>
    <div id="card"><span class="q">?</span></div>
    <div id="tiles"></div>
    <div id="markers"></div>
    <div id="slider"><div id="track"><div id="fill"></div></div><div id="handle" role="slider" aria-label="Blend slider">▶</div></div>
    <button id="next" hidden aria-label="Next word">▶</button>
    <div id="check" hidden>
      <button class="btn" id="check-home" aria-label="Home">⌂</button>
      <button class="btn" id="check-help" hidden aria-label="Help: show the sounds">🔊</button>
      <div class="L cword" id="check-word"></div>
      <div class="mascot"><svg width="64" height="64"><use href="#kit"/></svg><div class="bubble" id="check-bubble"></div></div>
      <div id="choices"></div>
    </div>
  </section>

  <!-- Phase 1–2 letter activities (spec §3.3–3.4) -->
  <section id="letters" class="screen" hidden aria-label="Letters">
    <div class="top">
      <button class="btn" id="l-home" aria-label="Home">⌂</button>
      <div class="path" id="l-pebbles"></div>
      <button class="btn coral" id="l-again" aria-label="Say it again">↻</button>
    </div>
    <div class="mascot" id="l-mascot"><svg width="80" height="80"><use href="#kit"/></svg><div class="bubble" id="l-bubble"></div></div>
    <div id="l-arena"></div>
    <button id="l-next" class="next" hidden aria-label="Next">▶</button>
    <div id="l-tray" hidden></div>
  </section>

  <section id="lesson" class="screen" hidden aria-label="Letter">
    <div class="top">
      <button class="btn" id="ls-home" aria-label="Home">⌂</button>
      <div class="path" id="ls-pebbles"></div>
      <button class="btn coral" id="ls-again" aria-label="Say it again">↻</button>
    </div>
    <div class="mascot" id="ls-mascot"><svg width="72" height="72"><use href="#kit"/></svg><div class="bubble" id="ls-bubble"></div></div>
    <div id="intro" hidden>
      <button class="icard L" id="ic-letter" aria-label="Letter"></button>
      <button class="ipic" id="ic-pic" aria-label="Picture"></button>
      <div class="ibar"><button class="btn" id="ic-replay" aria-label="Hear it again">🔁</button><button id="ic-next" class="wide" aria-label="Next">➜</button></div>
    </div>
    <div id="trace" hidden>
      <div class="tcard"><svg id="tr-svg" viewBox="-6 -6 112 192" aria-label="Trace the letter"></svg></div>
      <div class="ibar"><button class="btn" id="tr-undo" aria-label="Undo">↩️</button><div class="tray" id="tr-tray"></div><button id="tr-next" class="wide" aria-label="Next" hidden>➜</button></div>
    </div>
  </section>

  <section id="star" class="screen" hidden aria-label="Star word">
    <div class="top">
      <button class="btn" id="st-home" aria-label="Home">⌂</button>
      <div class="path" id="st-pebbles"></div>
      <button class="btn coral" id="st-again" aria-label="Say it again">↻</button>
    </div>
    <div class="mascot" id="st-mascot"><svg width="72" height="72"><use href="#kit"/></svg><div class="bubble" id="st-bubble"></div></div>
    <button class="starbig L" id="st-word" aria-label="Star word"></button>
    <div id="st-cards"></div>
    <button id="st-next" class="next" hidden aria-label="Next">▶</button>
  </section>

  <section id="sentence" class="screen" hidden aria-label="Sentence">
    <div class="top">
      <button class="btn" id="sn-home" aria-label="Home">⌂</button>
      <div class="path" id="sn-pebbles"></div>
      <button class="btn coral" id="sn-again" aria-label="Say it again">↻</button>
    </div>
    <div class="mascot" id="sn-mascot"><svg width="72" height="72"><use href="#kit"/></svg><div class="bubble" id="sn-bubble"></div></div>
    <div id="sn-card"><span class="q">?</span></div>
    <div id="sn-strip"></div>
    <div id="sn-tiles"></div>
    <button id="sn-next" class="next" hidden aria-label="Next word">▶</button>
    <div id="sn-slider"><div id="sn-track"><div id="sn-fill"></div></div><div id="sn-handle" role="slider" aria-label="Blend slider">◀▶</div></div>
    <div id="sn-choices" hidden></div>
    <button id="sn-read" disabled aria-label="Read it all">▶ <span class="emoji">📖</span></button>
  </section>

  <section id="family" class="screen" hidden aria-label="Word family">
    <div class="top">
      <button class="btn" id="fm-home" aria-label="Home">⌂</button>
      <div class="path" id="fm-pebbles"></div>
      <button class="btn coral" id="fm-again" aria-label="Say it again">↻</button>
    </div>
    <div class="mascot" id="fm-mascot"><svg width="72" height="72"><use href="#kit"/></svg><div class="bubble" id="fm-bubble"></div></div>
    <div id="fm-card"><span class="q">?</span></div>
    <div id="fm-word"><button id="fm-slot" class="L" data-dropslot aria-label="Empty slot: put a letter here"></button><div id="fm-rime" class="L"></div></div>
    <div id="fm-made" aria-label="Words made so far"></div>
    <div id="fm-tray"></div>
  </section>
  <section id="parent" class="screen" hidden aria-label="Grown-ups">
    <div class="pa-top"><h1>Grown-ups</h1><button class="pa-x" id="pa-close" aria-label="Close">×</button></div>
    <div id="pa-body"></div>
  </section>
  <section id="map" class="screen" hidden aria-label="Map">
    <div class="top">
      <button class="btn" id="m-home" aria-label="Home">⌂</button>
      <div class="starchip" id="m-stars" aria-label="Stars">⭐ 0</div>
      <button class="btn" id="m-gear" aria-label="Grown-ups (press and hold)">⚙</button>
    </div>
    <svg id="m-path" class="mpath"></svg>
    <div id="m-stops"></div>
    <div id="m-gate" hidden>Keep holding…</div>
    <button id="go" aria-label="Start"><svg width="40" height="40" viewBox="0 0 44 44"><path d="M12 6 L38 22 L12 38Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></button>
  </section>

  <section id="levelup" class="screen" hidden aria-label="Level up">
    <div id="lv-confetti"></div>
    <div class="lv-badge" id="lv-badge"><span>⭐</span></div>
    <div class="lv-kit"><svg width="96" height="96"><use href="#kit"/></svg></div>
    <div class="lv-say">You did it!</div>
    <div class="lv-chips" id="lv-chips"></div>
    <button id="lv-next" aria-label="Back to the map" disabled>➜</button>
  </section>

  <section id="done" class="screen" hidden aria-label="All done">
    <svg width="160" height="160"><use href="#kit"/></svg>
    <div class="bubble">All done for today. Great reading!</div>
    <div class="stickers emoji" id="stickers"></div>
    <button class="btn" id="done-home" aria-label="Home">⌂</button>
  </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
